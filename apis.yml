aid: pb-health
name: PB Health
description: PB Health (PB Healthcare Service Pvt Ltd) is an India-based consumer healthcare
  network offering end-to-end care through a single app - online doctor consultations,
  hospital visits and admissions, lab tests and radiology scans, medicine ordering, diabetes
  and obesity management, preventive health packages, and structured home care and recovery.
  The platform spans top specialities including cardiology, gastroenterology, orthopaedics,
  pulmonology, internal medicine, gynaecology, ENT, paediatrics, and minimal-access and
  bariatric surgery, and helps families coordinate their complete health and insurance
  journey. PB Health is a consumer mobile application (iOS and Android) and website; it
  does not publish a public developer API, developer portal, or API documentation.
